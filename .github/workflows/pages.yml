# Publishes the README as a documentation page, wrapped in the FivePaths
# microsite chrome (docs/template.html + cdn.fivepaths.com/microsite/v1).
# The README stays the single source of truth: this builds on every change
# to it, so the page can never drift from the repo.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # One-time prerequisite: Settings -> Pages -> Source: "GitHub Actions".
      # The workflow token can deploy to Pages but cannot create the site --
      # that is a repository-administration call GitHub never grants to
      # GITHUB_TOKEN, so the first enable is a human step.
      - uses: actions/configure-pages@v6
      - name: Build page from README
        run: |
          command -v pandoc || sudo apt-get install -y pandoc
          mkdir -p _site
          # The template's hero carries the title; drop the README's own
          # top-level heading so it does not repeat.
          sed '1{/^# /d;}' README.md > /tmp/readme-body.md
          pandoc /tmp/readme-body.md \
            --from gfm --to html5 --no-highlight \
            --template docs/template.html \
            --metadata pagetitle='gtfs-realtime-php — PHP bindings for GTFS Realtime' \
            -o _site/index.html
          # base.css styles code blocks as pre.code (the house "board" look,
          # with overflow-x); pandoc emits bare <pre> for plain fences and
          # <pre class="lang"> for tagged ones.
          sed -i -e 's/<pre class="/<pre class="code /g' -e 's/<pre>/<pre class="code">/g' _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
